<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Virgin Active Clock</title>

<style>
@font-face{
  font-family:'GothamBook';
  src:url('Gotham-Book.otf') format('opentype');
}

@font-face{
  font-family:'GothamLight';
  src:url('Gotham-XLight.otf') format('opentype');
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html, body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:'GothamBook', Arial, sans-serif;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}

.wrapper{
  width:100vw;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:7vw 8vw;
  opacity:0;
  transition:opacity .35s ease;
}

.wrapper.ready{
  opacity:1;
}

.logo-area{
  width:44%;
  display:flex;
  align-items:center;
}

.logo{
  width:92%;
  max-width:720px;
  display:block;
}

.clock-area{
  width:48%;
  text-align:right;
}

.clock-block{
  display:inline-block;
  text-align:center;
}

#clock{
  font-family:'GothamBook', Arial, sans-serif;
  display:block;
  font-size:9.8vw;
  font-weight:500;
  line-height:.86;
  letter-spacing:.01em;
  white-space:nowrap;
}

#date{
  display:block;
  width:100%;
  margin-top:30px;
  font-family:'GothamBook', Arial, sans-serif;
  font-size:1.48vw;
  font-weight:700;
  letter-spacing:.42em;
  opacity:.72;
  text-align:center;
  white-space:nowrap;
}

@media (orientation: portrait){
  .wrapper{
    flex-direction:column;
    justify-content:center;
    padding:9vh 7vw;
    gap:8vh;
  }

  .logo-area{
    width:100%;
    justify-content:center;
  }

  .logo{
    width:68%;
    max-width:620px;
  }

  .clock-area{
    width:100%;
    text-align:center;
  }

  #clock{
    font-size:18vw;
  }

  #date{
    margin-top:28px;
    font-size:2.5vw;
    letter-spacing:.34em;
  }
}
</style>
</head>

<body>

<div class="wrapper" id="wrapper">

  <div class="logo-area">
    <img src="logo.png" class="logo" alt="Virgin Active">
  </div>

  <div class="clock-area">
    <div class="clock-block">
      <div id="clock">00:00</div>
      <div id="date">DOMENICA 17 MAGGIO 2026</div>
    </div>
  </div>

</div>

<script>
function updateClock(){
  const now = new Date();

  const hours = String(now.getHours()).padStart(2,'0');
  const minutes = String(now.getMinutes()).padStart(2,'0');

  document.getElementById('clock').textContent = `${hours}:${minutes}`;

  const options = {
    weekday:'long',
    day:'numeric',
    month:'long',
    year:'numeric'
  };

  document.getElementById('date').textContent =
    now.toLocaleDateString('it-IT', options).toUpperCase();

  document.getElementById('wrapper').classList.add('ready');
}

window.addEventListener('load', function(){
  document.fonts.ready.then(function(){
    updateClock();
  });
});

setInterval(updateClock, 1000);
</script>

</body>
</html>
